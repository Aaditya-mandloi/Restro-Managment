<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Order History</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


<style>

body{
    background:#f8f9fa;
    font-family:'Segoe UI',sans-serif;
}


.page-title{

    font-size:3rem;
    font-weight:700;
    text-align:center;
    margin:40px 0;
    color:#222;

}


.order-card{

    border:none;
    border-radius:20px;
    box-shadow:0 8px 20px rgba(0,0,0,.1);
    margin-bottom:25px;
    overflow:hidden;

}


.order-header{

    background:#212529;
    color:white;
    padding:20px;

}


.order-body{

    padding:25px;

}


.food-item{

    display:flex;
    justify-content:space-between;
    border-bottom:1px solid #ddd;
    padding:10px 0;

}


.total{

    font-size:1.3rem;
    font-weight:bold;
    color:#ff5722;

}


.status{

    padding:8px 15px;
    border-radius:20px;
    font-weight:600;

}


.preparing{

    background:#fff3cd;
    color:#856404;

}


.delivered{

    background:#d1e7dd;
    color:#0f5132;

}


.cancelled{

    background:#f8d7da;
    color:#842029;

}


.btn-menu{

    background:#ff5722;
    color:white;
    font-weight:bold;
}


.btn-menu:hover{

    background:#e64a19;
    color:white;

}


</style>

</head>


<body>


<div class="container">


<h1 class="page-title">
📦 My Orders
</h1>



<!-- Order 1 -->

<div class="card order-card">


<div class="order-header">

<h4>
Order #1001
</h4>

<p class="mb-0">
Placed on: 06 Aug 2026
</p>

</div>



<div class="order-body">


<div class="food-item">

<span>
Regular Thali
</span>

<span>
₹120
</span>

</div>


<div class="food-item">

<span>
Paneer Butter Masala
</span>

<span>
₹220
</span>

</div>


<div class="food-item">

<span>
Butter Naan
</span>

<span>
₹50
</span>

</div>



<div class="d-flex justify-content-between mt-4">


<h5>
Total
</h5>


<h5 class="total">
₹390
</h5>


</div>


<hr>


<div class="d-flex justify-content-between align-items-center">


<span class="status preparing">
🍳 Preparing
</span>


<button class="btn btn-primary">
Track Order
</button>


</div>



</div>

</div>






<!-- Order 2 -->

<div class="card order-card">


<div class="order-header">

<h4>
Order #1000
</h4>


<p class="mb-0">
Placed on: 01 Aug 2026
</p>


</div>



<div class="order-body">


<div class="food-item">

<span>
Veg Burger
</span>

<span>
₹150
</span>

</div>



<div class="food-item">

<span>
French Fries
</span>

<span>
₹90
</span>

</div>



<div class="d-flex justify-content-between mt-4">


<h5>
Total
</h5>


<h5 class="total">
₹240
</h5>


</div>


<hr>


<div>

<span class="status delivered">
✅ Delivered
</span>

</div>



</div>


</div>





<div class="text-center mt-5">


<a href="{% url 'menu' %}" 
class="btn btn-menu btn-lg">

🍽 Order Again

</a>


</div>



</div>



</body>

</html>
