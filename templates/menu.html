<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Menu</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f8f9fa;
            font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
        }

        .menu-title{
            font-size:3rem;
            font-weight:700;
            text-align:center;
            margin:40px 0;
            color:#222;
        }

        #menu h2{
            margin:50px 0 25px;
            font-weight:700;
            color:#343a40;
            border-left:6px solid #ff6b35;
            padding-left:15px;
        }

        .food-card{
            border:none;
            border-radius:18px;
            overflow:hidden;
            transition:.3s;
            box-shadow:0 8px 20px rgba(0,0,0,.08);
            background:#fff;
            height:100%;
        }

        .food-card:hover{
            transform:translateY(-8px);
            box-shadow:0 15px 35px rgba(0,0,0,.15);
        }

        .food-card img{
            width:100%;
            height:240px;
            object-fit:cover;
        }

        .card-body{
            padding:20px;
        }

        .food-card h4{
            font-size:1.4rem;
            font-weight:700;
            color:#222;
        }

        .food-card p{
            color:#666;
            min-height:50px;
        }

        .price{
            font-size:1.4rem;
            color:#ff5722;
            font-weight:bold;
        }

        .btn-cart{
            background:#ff5722;
            color:white;
            border:none;
            border-radius:10px;
            font-weight:600;
            padding:10px;
            transition:.3s;
        }

        .btn-cart:hover{
            background:#e64a19;
            color:white;
        }
    </style>
</head>

<body>

<div class="container py-5">

    <h1 class="menu-title">🍽️ Our Delicious Menu</h1>

    <div id="menu" class="row">

        {% for category in categories %}

        <div class="col-12">
            <h2>{{ category.name }}</h2>
        </div>

        {% for item in category.items.all %}

        <div class="col-lg-4 col-md-6 mb-4">

            <div class="card food-card">

                <img src="{{ item.image_url|default:'https://via.placeholder.com/600x400' }}"
                     alt="{{ item.name }}">

                <div class="card-body text-center">

                    <h4>{{ item.name }}</h4>

                    <p>{{ item.description }}</p>

                    <div class="price mb-3">
                        ₹{{ item.price }}
                    </div>

                    <button
                        class="btn btn-cart w-100 add-cart"
                        data-name="{{ item.name }}"
                        data-price="{{ item.price }}">
                        🛒 Add to Cart
                    </button>

                </div>

            </div>

        </div>

        {% endfor %}

        {% endfor %}

    </div>

</div>
<!-- Floating Cart -->
<div class="position-fixed bottom-0 end-0 m-4" style="width:350px; z-index:1000;">

    <div class="card shadow-lg">

        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">🛒 Cart</h5>
        </div>

        <div class="card-body">

            <ul id="cart-items" class="list-group mb-3"></ul>

            <h5 class="text-end">
                Total : ₹<span id="cart-total">0.00</span>
            </h5>

            <a href="{% url 'checkout' %}" class="text-decoration-none">
                <button class="btn btn-success w-100">
                    Checkout
                </button>
            </a>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

const cartItems = document.getElementById("cart-items");
const totalPrice = document.getElementById("cart-total");

document.querySelectorAll(".add-cart").forEach(button=>{

    button.addEventListener("click",function(){

        const name=this.dataset.name;
        const price=parseFloat(this.dataset.price);

        cart.push({
            name:name,
            price:price
        });

        saveCart();
        renderCart();

    });

});
function saveCart(){

    localStorage.setItem("cart",JSON.stringify(cart));

}

function renderCart(){

    cartItems.innerHTML="";

    let total=0;

    if(cart.length===0){

        cartItems.innerHTML=`
            <li class="list-group-item text-center">
                Cart is Empty
            </li>
        `;

    }

    cart.forEach((item,index)=>{

        total+=item.price;

        cartItems.innerHTML+=`

        <li class="list-group-item d-flex justify-content-between align-items-center">

            <div>

                <strong>${item.name}</strong><br>

                ₹${item.price}

            </div>

            <button
            class="btn btn-sm btn-danger"
            onclick="removeItem(${index})">

            ×

            </button>

        </li>

        `;

    });

    totalPrice.innerHTML=total.toFixed(2);

}
function removeItem(index){

    cart.splice(index,1);

    saveCart();

    renderCart();

}

renderCart();

</script>

</body>
</html>
