<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Checkout</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f8f9fa;
      }

      .checkout-card {
        border-radius: 15px;
      }

      /* Cart button */
      .cart-button {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 1000;
        border-radius: 50px;
        padding: 10px 18px;
      }

      /* Close button */
      .close-cart {
        border: none;
        background: transparent;
        color: white;
        font-size: 28px;
        font-weight: bold;
        line-height: 1;
        cursor: pointer;
      }

      .close-cart:hover {
        color: #ffcccc;
      }

      /* Hide checkout initially */
      #checkoutSection {
        display: block;
      }
    </style>
  </head>

  <body>

    <!-- CART BUTTON -->
    <button
      type="button"
      class="btn btn-primary cart-button"
      onclick="openCart()"
    >
      🛒 Cart
      <span class="badge bg-light text-dark" id="cartCount">0</span>
    </button>

    <!-- CHECKOUT / CART SECTION -->
    <div class="container py-5" id="checkoutSection">

      <div class="row">

        <!-- ORDER -->
        <div class="col-lg-8">
          <div class="card checkout-card shadow">

            <div
              class="card-header bg-dark text-white d-flex justify-content-between align-items-center"
            >
              <h3 class="mb-0">Your Order</h3>

              <!-- X BUTTON -->
              <button
                type="button"
                class="close-cart"
                onclick="closeCart()"
                aria-label="Close cart"
              >
                &times;
              </button>
            </div>

            <div class="card-body">

              <table class="table">
                <thead>
                  <tr>
                    <th>Item</th>
                    <th>Price</th>
                  </tr>
                </thead>

                <tbody id="orderItems"></tbody>
              </table>

              <h3 class="text-end">
                Total : ₹<span id="grandTotal">0</span>
              </h3>

            </div>
          </div>
        </div>

        <!-- CUSTOMER DETAILS -->
        <div class="col-lg-4">

          <div class="card shadow">

            <div
              class="card-header bg-success text-white d-flex justify-content-between align-items-center"
            >
              <h4 class="mb-0">Customer Details</h4>

              <!-- X BUTTON -->
              <button
                type="button"
                class="close-cart"
                onclick="closeCart()"
                aria-label="Close checkout"
              >
                &times;
              </button>
            </div>

            <div class="card-body">

              <form method="POST" action="{% url 'checkout' %}">

                {% csrf_token %}

                <div class="mb-3">
                  <label>Name</label>

                  <input
                    type="text"
                    class="form-control"
                    name="name"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label>Phone</label>

                  <input
                    type="text"
                    class="form-control"
                    name="phone"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label>Address</label>

                  <textarea
                    class="form-control"
                    rows="4"
                    name="address"
                    required
                  ></textarea>
                </div>

                <!-- CART DATA -->
                <input
                  type="hidden"
                  name="cart_data"
                  id="cartData"
                />

                <button
                  type="submit"
                  class="btn btn-success w-100"
                >
                  Place Order
                </button>

              </form>

            </div>
          </div>

        </div>
      </div>
    </div>

    <script>

      /*
       * GET CART FROM LOCAL STORAGE
       */
      function getCart() {
        return JSON.parse(localStorage.getItem("cart")) || [];
      }


      /*
       * DISPLAY CART
       */
      function displayCart() {

        const cart = getCart();

        const orderItems =
          document.getElementById("orderItems");

        const grandTotal =
          document.getElementById("grandTotal");

        const cartData =
          document.getElementById("cartData");

        const cartCount =
          document.getElementById("cartCount");


        orderItems.innerHTML = "";

        let total = 0;


        cart.forEach((item) => {

          total += Number(item.price);

          orderItems.innerHTML += `
            <tr>
              <td>${item.name}</td>
              <td>₹${Number(item.price).toFixed(2)}</td>
            </tr>
          `;

        });


        grandTotal.innerHTML = total.toFixed(2);

        cartData.value = JSON.stringify(cart);

        cartCount.innerHTML = cart.length;


        /*
         * If cart is empty
         */
        if (cart.length === 0) {

          orderItems.innerHTML = `
            <tr>
              <td colspan="2" class="text-center text-muted">
                Your cart is empty.
              </td>
            </tr>
          `;

        }

      }


      /*
       * CLOSE CART
       */
      function closeCart() {

        document.getElementById(
          "checkoutSection"
        ).style.display = "none";

      }


      /*
       * OPEN CART
       */
      function openCart() {

        document.getElementById(
          "checkoutSection"
        ).style.display = "block";

        displayCart();

      }


      /*
       * INITIAL LOAD
       */
      displayCart();

    </script>

  </body>
</html>
