
name: Unity Restaurant CI-CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t unity-restaurant:test .

      - name: Check Django application
        run: |
          docker run --rm \
            -e DJANGO_SECRET_KEY=ci-testing-only-key \
            unity-restaurant:test \
            python manage.py check

      - name: Run Django tests
        run: |
          docker run --rm \
            -e DJANGO_SECRET_KEY=ci-testing-only-key \
            unity-restaurant:test \
            python manage.py test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker image
        run: |
          docker tag unity-restaurant:test aadity1115/unity-restaurant:latest
          docker tag unity-restaurant:test aadity1115/unity-restaurant:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push aadity1115/unity-restaurant:latest
          docker push aadity1115/unity-restaurant:${{ github.sha }}
