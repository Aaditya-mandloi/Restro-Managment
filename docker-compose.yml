
services:
  web:
    build: .
    image: unity-restaurant:1.0
    container_name: unity-restaurant

    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - .env

    environment:
      DATABASE_PATH: /data/db.sqlite3

    volumes:
      - ./data:/data

    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

    restart: unless-stopped
